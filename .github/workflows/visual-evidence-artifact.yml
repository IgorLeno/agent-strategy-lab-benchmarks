# Transporte binário cego da evidence visual já existente.
# Não recaptura, não comprime, não gera preview, não corre benchmark, não chama modelo.
# B01: PNGs canônicos selados → artifact visual-b01-blind-review.
# B03-R2: PNGs canônicos selados → artifact visual-b03-r2-blind-review.
# Demais bundles: JPEGs de connector preview.
name: Visual evidence artifact

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Blind bundle to package. Arm names are never used.
        type: choice
        default: CLAUDE-SONNET5-MEDIUM-B01-V1
        options:
          - CLAUDE-SONNET5-MEDIUM-B01-V1
          - CLAUDE-SONNET5-MEDIUM-B03-R2
          - CLAUDE-SONNET5-MEDIUM-B04-V1
          - visual-access-check

permissions:
  contents: read

jobs:
  package-b01-blind-review:
    if: ${{ inputs.bundle == 'CLAUDE-SONNET5-MEDIUM-B01-V1' }}
    name: Package B01 canonical blind review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage sealed PNGs byte-for-byte
        run: |
          set -euo pipefail
          node scripts/visual-evidence/stage-b01-blind-review.mjs \
            --out "${{ github.workspace }}/.staging/visual-b01-blind-review"

      - name: Upload visual-b01-blind-review
        uses: actions/upload-artifact@v7
        with:
          name: visual-b01-blind-review
          if-no-files-found: error
          retention-days: 30
          path: ${{ github.workspace }}/.staging/visual-b01-blind-review

  package-b03-r2-blind-review:
    if: ${{ inputs.bundle == 'CLAUDE-SONNET5-MEDIUM-B03-R2' }}
    name: Package B03 R2 canonical blind review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage sealed PNGs byte-for-byte
        run: |
          set -euo pipefail
          node scripts/visual-evidence/stage-b03-r2-blind-review.mjs \
            --out "${{ github.workspace }}/.staging/visual-b03-r2-blind-review"

      - name: Upload visual-b03-r2-blind-review
        uses: actions/upload-artifact@v7
        with:
          name: visual-b03-r2-blind-review
          if-no-files-found: error
          retention-days: 30
          path: ${{ github.workspace }}/.staging/visual-b03-r2-blind-review

  package-blind-previews:
    if: ${{ inputs.bundle != 'CLAUDE-SONNET5-MEDIUM-B01-V1' && inputs.bundle != 'CLAUDE-SONNET5-MEDIUM-B03-R2' }}
    name: Package blind connector previews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ROOT: ${{ inputs.bundle == 'visual-access-check' && 'evaluation/visual-access-check' || format('evaluation/blind/{0}', inputs.bundle) }}
      ARTIFACT_PREFIX: ${{ inputs.bundle == 'visual-access-check' && 'visual-access-check' || (inputs.bundle == 'CLAUDE-SONNET5-MEDIUM-B01-V1' && 'visual-b01' || 'visual-b04') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify existing connector previews
        run: |
          set -euo pipefail
          for candidate in candidate-x candidate-y; do
            node scripts/visual-evidence/verify-connector-previews.mjs \
              --bundle "${BUNDLE_ROOT}/${candidate}"
          done

      - name: Upload Candidate X
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate-x
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.BUNDLE_ROOT }}/candidate-x/connector-previews/*.jpg
            ${{ env.BUNDLE_ROOT }}/candidate-x/connector-preview-manifest.json
            ${{ env.BUNDLE_ROOT }}/candidate-x/visual-manifest.json

      - name: Upload Candidate Y
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate-y
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.BUNDLE_ROOT }}/candidate-y/connector-previews/*.jpg
            ${{ env.BUNDLE_ROOT }}/candidate-y/connector-preview-manifest.json
            ${{ env.BUNDLE_ROOT }}/candidate-y/visual-manifest.json
